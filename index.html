<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<body>
<style>
@font-face{font-family:'Alegreya SC';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/alegreya-sc-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya SC';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/alegreya-sc-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/alegreya-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/alegreya-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/alegreya-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
/* Layout: a route strip across the top, then a sticky "what next / what to avoid" column beside the full quest ledger; stacked on phones. */
:root{
  --bg:#e4e8e6; --surface:#f1f4f2; --ink:#182126; --muted:#56646a; --line:#bec8c6;
  --accent:#2c6c71; --accent-soft:#cfe2e1; --bronze:#80601f; --danger:#a22f2c; --danger-soft:#f0d6d3;
  --warn:#8f6209; --warn-soft:#f1e3c2; --ok:#3b774a;
  --f-display:"Alegreya SC",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151a; --surface:#182026; --ink:#e2e8e6; --muted:#94a1a5; --line:#2a353c;
    --accent:#6fb7ba; --accent-soft:#1f3a3d; --bronze:#cfa95a; --danger:#e47570; --danger-soft:#3a1f1f;
    --warn:#dca847; --warn-soft:#362b13; --ok:#82c392; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151a; --surface:#182026; --ink:#e2e8e6; --muted:#94a1a5; --line:#2a353c;
  --accent:#6fb7ba; --accent-soft:#1f3a3d; --bronze:#cfa95a; --danger:#e47570; --danger-soft:#3a1f1f;
  --warn:#dca847; --warn-soft:#362b13; --ok:#82c392; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

header.top{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between;padding-bottom:16px}
h1{font-family:var(--f-display);font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:.01em}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--f-display);font-size:26px;font-weight:700;margin-right:4px}
.stat span{font-size:14px;color:var(--muted)}
.stat.bad b{color:var(--danger)} .stat.warn b{color:var(--warn)}

.route{display:flex;gap:3px;margin-bottom:6px}
.seg{flex:var(--w) 1 0;min-width:0;height:10px;background:var(--line);position:relative;border:0;padding:0;border-radius:1px}
.seg i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:var(--p)}
.seg u{position:absolute;inset:0 0 0 auto;background:var(--danger);width:var(--l);text-decoration:none}
.route-labels{display:none;gap:3px;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.04em}
.route-labels span{flex:var(--w) 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:900px){.route-labels{display:flex}}
.route-cap{font-size:13px;color:var(--muted);margin:8px 0 22px}

.layout{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
aside{display:flex;flex-direction:column;gap:18px}
@media(min-width:901px){aside{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}}

.panel{border:1px solid var(--line);background:var(--surface);border-radius:4px}
.panel>h2{font-family:var(--f-display);font-size:21px;padding:12px 14px 2px}
.panel>.sub{padding:0 14px 8px;font-size:14px;color:var(--muted)}
.panel.avoid{border-color:var(--danger)}
.panel.avoid>h2{color:var(--danger)}
.plist{list-style:none;margin:0;padding:0}
.plist>li{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.plist .main{min-width:0;flex:1}
.pname{font-weight:700;font-size:17px;line-height:1.2;background:none;border:0;padding:0;text-align:left}
.pname:hover{text-decoration:underline}
.pmeta{font-size:14px;color:var(--muted);margin-top:3px}
.pmeta b{color:var(--ink);font-weight:700}
.stop{font-size:14px;margin-top:4px}
.stop b{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--bronze);margin-right:6px;font-weight:500}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.more{width:100%;padding:9px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:var(--accent);font-size:14px}
.empty{padding:12px 14px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.tips{margin:0;padding:4px 14px 14px 32px;font-size:14.5px;color:var(--muted)}
.tips li{margin-top:6px}

.tick{flex:none;width:24px;height:24px;margin-top:1px;border:1.5px solid var(--muted);background:var(--bg);border-radius:3px;display:grid;place-items:center;padding:0;color:transparent}
.tick:hover{border-color:var(--accent)}
.tick[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tick svg{width:15px;height:15px}

.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px}
.seggroup{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface)}
.seggroup button{border:0;background:none;padding:6px 11px;font-size:14px;border-right:1px solid var(--line)}
.seggroup button:last-child{border-right:0}
.seggroup button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{flex:1 1 160px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);font:inherit}
.dlc{display:flex;gap:14px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.dlc label{display:flex;gap:6px;align-items:center;cursor:pointer}

.group{border-top:2px solid var(--ink);margin-top:14px}
.ghead{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px 2px;text-align:left}
.ghead h3{font-family:var(--f-display);font-size:23px;flex:1;min-width:0}
.gcount{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.gcount.lost{color:var(--danger);margin-left:8px}
.chev{width:12px;height:12px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.ghead[aria-expanded="true"] .chev{transform:rotate(45deg)}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;gap:11px;padding:10px 2px;border-top:1px solid var(--line);align-items:flex-start}
.row .body{flex:1;min-width:0}
.row .title{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.row .name{font-weight:700;font-size:17px}
.row.done .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.row.skipped .name{color:var(--muted);font-style:italic}
.row.lockedrow .name{color:var(--muted)}
.row .meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:3px;align-items:center}
.row .note{font-size:14.5px;color:var(--muted);margin-top:3px}
.row .skip{flex:none;border:0;background:none;color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 2px;align-self:flex-start}
.row .skip:hover{color:var(--ink);text-decoration:underline}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;background:var(--accent-soft)}.chev{transition:none}}

.tag,.pill{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:1px 6px;border-radius:2px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.main{color:var(--bronze);border-color:var(--bronze)}
.tag.contract{color:var(--accent);border-color:var(--accent)}
.tag.treasure,.tag.event,.tag.race{border-style:dashed}
.lv{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.row .name a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:1px;text-underline-offset:3px}
.row .name a:hover{color:var(--accent);text-decoration-color:var(--accent)}
.row.done .name a{color:var(--muted)}
.row .name .ext{font-size:12px;color:var(--muted);margin-left:3px;text-decoration:none;display:inline-block}
.row .sheet{font-size:14px;color:var(--muted);margin-top:3px}
.row .guide{font-size:14.5px;margin-top:3px}
.row .guide b,.row .sheet b{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin-right:6px;color:var(--bronze)}
.row .sheet b{color:var(--muted)}
.row .chain{font-size:13px;color:var(--muted);margin-top:3px}
.row .chain a{color:var(--accent)}
.sublabel{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 14px 0;border-top:1px solid var(--line)}
.pill.risk{color:var(--warn);border-color:var(--warn);background:var(--warn-soft);white-space:normal}
.pill.lock{color:#fff;background:var(--danger);border-color:var(--danger);white-space:normal}
.pill.hold{color:var(--bronze);border-color:var(--bronze);white-space:normal}
:root[data-theme="dark"] .pill.lock{color:#1a0d0d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.lock{color:#1a0d0d}}

footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
footer a{color:var(--accent)}
.reset{border:1px solid var(--line);background:none;border-radius:4px;padding:5px 10px;font-size:14px}
.reset.arm{border-color:var(--danger);color:var(--danger)}
.sync{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nores{padding:18px 2px;color:var(--muted)}

[data-leg="wo"]{--rc:#8b5e34}[data-leg="velen"]{--rc:#5a7a2c}[data-leg="nov"]{--rc:#a23d77}
[data-leg="skel"]{--rc:#2b6a99}[data-leg="km"]{--rc:#5f6b80}[data-leg="hos"]{--rc:#6a4fb0}[data-leg="bw"]{--rc:#a8820a}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) [data-leg="wo"]{--rc:#d19a66}:root:not([data-theme="light"]) [data-leg="velen"]{--rc:#a3c46a}
  :root:not([data-theme="light"]) [data-leg="nov"]{--rc:#e68cc0}:root:not([data-theme="light"]) [data-leg="skel"]{--rc:#6fb0e0}
  :root:not([data-theme="light"]) [data-leg="km"]{--rc:#a9b4c8}:root:not([data-theme="light"]) [data-leg="hos"]{--rc:#ab9cf0}
  :root:not([data-theme="light"]) [data-leg="bw"]{--rc:#e3c344}
}
:root[data-theme="dark"] [data-leg="wo"]{--rc:#d19a66}:root[data-theme="dark"] [data-leg="velen"]{--rc:#a3c46a}
:root[data-theme="dark"] [data-leg="nov"]{--rc:#e68cc0}:root[data-theme="dark"] [data-leg="skel"]{--rc:#6fb0e0}
:root[data-theme="dark"] [data-leg="km"]{--rc:#a9b4c8}:root[data-theme="dark"] [data-leg="hos"]{--rc:#ab9cf0}
:root[data-theme="dark"] [data-leg="bw"]{--rc:#e3c344}
.seg i{background:var(--rc,var(--accent))}
.route-labels span{color:var(--rc,var(--muted))}
.group{border-top-color:var(--rc,var(--ink))}
.ghead h3{color:var(--rc,inherit)}
.group .row{border-left:4px solid var(--rc);padding-left:10px}
.reg,.pmeta b.reg{color:var(--rc)}

.iopanel{margin-top:28px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:12px 14px}
.iopanel h2{font-family:var(--f-display);font-size:20px;margin-bottom:4px}
.iopanel p{margin:0 0 8px;font-size:14px;color:var(--muted)}
.iopanel textarea{width:100%;min-height:150px;max-height:50vh;resize:vertical;font-family:var(--f-mono);font-size:12px;line-height:1.4;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.iopanel .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.iopanel .acts button{border:1px solid var(--line);background:none;border-radius:4px;padding:5px 12px;font-size:14px}
.iopanel .acts button.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.iopanel .msg{font-size:14px;color:var(--muted)}
.iopanel .msg.bad{color:var(--danger)}

.cb{display:flex;gap:8px;align-items:flex-start}
.cb>div{flex:1;min-width:0}
.tick.sm{width:18px;height:18px;margin-top:2px;border-width:1.5px}
.tick.sm svg{width:12px;height:12px}
.plist .cb{margin-top:5px;font-size:14px}
</style>

<div class="wrap" id="app"></div>

u found the location of Tamara, tell the Baron about Tamara before you tell him about Anna, or the conversation ends without the option to tell him about Tamara.","st":"After completing Ladies of the Wood, do not talk to the Baron. Do A Mysterious Passenger first.","pt":1,"pf":"family2","o":85,"i":278},{"k":"ladies1","n":"Ladies of the Wood","s":"velen","t":"main","l":6,"u":"https://witcher.fandom.com/wiki/Ladies_of_the_Wood","nd":["bloodybaron"],"st":"Stop once Johnny has his voice back. Do not follow him to the orphanage.","pt":1,"pf":"ladies2","o":28,"i":284},{"k":"favor1","n":"A Favor for a Friend","s":"velen","t":"side","l":6,"u":"https://witcher.fandom.com/wiki/A_Favor_for_a_Friend","nd":["nilf"],"st":"Return the package to Keira and leave the dialogue without picking the orange wait option. Do not finish the quest yet.","pt":1,"pf":"favor2","o":30,"i":65},{"k":"redania1","n":"Redania's Most Wanted","s":"nov","t":"side","l":12,"u":"https://witcher.fandom.com/wiki/Redania%27s_Most_Wanted","nd":["getjr"],"st":"Get the crystal and kill the witch hunters. Do not continue yet. In Skellige ask Yennefer about it but do not hand it over.","pt":1,"pf":"redania2","o":47,"i":156}];
const Q=RAW.map(function(d){
  return {key:d.k,name:d.n,leg:d.s,kind:d.t,level:d.l,url:d.u||"",
    cut:d.c||[],needs:d.nd||[],hold:d.h||[],pre:d.p||[],note:d.nt||"",stop:d.st||"",
    soft:!!d.sf,opt:!!d.op,during:d.du||[],part:!!d.pt,dlc:d.s==="hos"||d.s==="bw"?d.s:null,
    partOf:d.pf||null,region:d.r||"",comment:d.cm||"",prev:d.pv||null,next:d.nx||null,ord:d.o,row:d.i};
});
const byKey={};
/* Guide-ordered quests sort by guide position; the rest follow in sheet order. */
Q.forEach(function(x){x.idx=(typeof x.ord==="number")?x.ord:1000+x.row;byKey[x.key]=x;});
Q.sort(function(a,b){return a.idx-b.idx;});
/* A quest split into a stop-point part and a finishing part: the full quest points at its part. */
Q.forEach(function(x){if(x.partOf&&byKey[x.partOf])byKey[x.partOf].partQ=x;});
const legName={};LEGS.forEach(function(l){legName[l[0]]=l[1];});

/* ---------- derived view ---------- */
function newState(){return {s:{},dlc:{hos:true,bw:true},t:0};}
function view(S){
  const st=function(k){return S.s[k]||0;};
  const res=function(k){return st(k)>0;};
  const act=Q.filter(function(x){return !x.dlc||S.dlc[x.dlc];});
  const isAct={};act.forEach(function(x){isAct[x.key]=true;});
  const gatesOf=function(x){return x.cut.concat(x.pre);};
  const locked={};
  act.forEach(function(x){if(!res(x.key)&&x.cut.some(function(c){return st(c)===1;}))locked[x.key]=true;});
  const risk={};
  act.forEach(function(x){if(!res(x.key)&&!locked[x.key]&&gatesOf(x).some(function(c){return isAct[c];}))risk[x.key]=true;});
  const victims=function(g){return act.filter(function(x){return gatesOf(x).indexOf(g)>=0&&!res(x.key)&&!locked[x.key];});};
  /* Soft victims, optional ones, ones that start inside the gate quest, and "pre" (do-it-before) ones do not block a gate. */
  const blockers=function(g){return victims(g).filter(function(x){return !x.soft&&!x.opt&&x.pre.indexOf(g)<0&&x.during.indexOf(g)<0;});};
  const needsOk=function(x){return x.needs.every(function(n){return !isAct[n]||res(n);});};
  const holdOk=function(x){return x.hold.every(function(h){return !isAct[h]||res(h);});};
  const free=function(x){return !res(x.key)&&!locked[x.key]&&!x.opt&&needsOk(x)&&holdOk(x)&&blockers(x.key).length===0;};
  const next=act.filter(function(x){return typeof x.ord==="number"&&free(x);});
  /* An area's side quests open up once something there is done, or something there is on the Do next list. */
  const reached={};
  act.forEach(function(x){if(res(x.key))reached[x.leg]=true;});
  next.forEach(function(x){reached[x.leg]=true;});
  /* Safe side quests: every free side quest or contract in a reached area, lowest level first. Collect 'Em All goes last. */
  const anytime=act.filter(function(x){
    return typeof x.ord!=="number"&&(x.kind==="side"||x.kind==="contract")&&free(x)&&reached[x.leg];
  }).sort(function(a,b){
    return (a.key==="collect_em_all"?1:0)-(b.key==="collect_em_all"?1:0)||(a.level||0)-(b.level||0)||a.row-b.row;
  });
  const gating={};
  const gates=[];
  act.forEach(function(x){
    if(res(x.key))return;
    const v=victims(x.key);
    if(v.length)gates.push({q:x,victims:v,blockers:blockers(x.key),startable:needsOk(x)});
  });
  gates.sort(function(a,b){return b.victims.length-a.victims.length||a.q.idx-b.q.idx;});
  const holds=act.filter(function(x){return !res(x.key)&&x.hold.length&&needsOk(x)&&!holdOk(x);})
    .map(function(x){return {q:x,wait:x.hold.filter(function(h){return isAct[h]&&!res(h);}).map(function(h){return byKey[h];})};});
  const counted=act.filter(function(x){return !x.part;});
  const leg={};
  LEGS.forEach(function(l){leg[l[0]]={total:0,done:0,skip:0,lost:0};});
  counted.forEach(function(x){
    const L=leg[x.leg];L.total++;
    if(st(x.key)===1)L.done++;else if(st(x.key)===2)L.skip++;else if(locked[x.key])L.lost++;
  });
  return {act:act,locked:locked,risk:risk,next:next,anytime:anytime,gating:gating,reached:reached,gates:gates,holds:holds,leg:leg,
    total:counted.length,
    done:counted.filter(function(x){return st(x.key)===1;}).length,
    lost:counted.filter(function(x){return locked[x.key];}).length,
    atrisk:counted.filter(function(x){return risk[x.key];}).length,
    victims:victims,needsOk:needsOk};
}
var W3={Q:Q,LEGS:LEGS,KINDS:KINDS,byKey:byKey,legName:legName,view:view,newState:newState};

</script>

<script id="ui">
(function(){
"use strict";
var KEY="witcher-quest-ledger.v1";

var app=document.getElementById("app");
var byKey=W3.byKey;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';

/* ---------- persistence ---------- */
function normalize(r){
  var n=W3.newState();
  if(r&&typeof r==="object"){
    if(r.s&&typeof r.s==="object"){Object.keys(r.s).forEach(function(k){if(byKey[k]&&(r.s[k]===1||r.s[k]===2))n.s[k]=r.s[k];});}
    if(r.dlc){n.dlc.hos=r.dlc.hos!==false;n.dlc.bw=r.dlc.bw!==false;}
    n.t=Number(r.t)||0;
  }
  return n;
}
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify({s:S.s,dlc:S.dlc,t:S.t}));}catch(e){}}
function loadLocal(){try{var raw=localStorage.getItem(KEY);if(raw)S=normalize(JSON.parse(raw));}catch(e){}}
var cloud={ref:null,timer:0,busy:false,again:false};
function setSync(v){ui.sync=v;var el=document.getElementById("sync");if(el)el.textContent=syncText();}
function syncText(){return ui.sync==="cloud"?"Saved to your account":ui.sync==="saving"?"Saving...":"Saved on this device";}
function pushCloud(){
  if(!cloud.ref)return;
  clearTimeout(cloud.timer);
  cloud.timer=setTimeout(async function run(){
    if(cloud.busy){cloud.again=true;return;}
    cloud.busy=true;setSync("saving");
    try{await cloud.ref.set({s:S.s,dlc:S.dlc,t:S.t});setSync("cloud");}catch(e){setSync("local");}
    cloud.busy=false;
    if(cloud.again){cloud.again=false;pushCloud();}
  },700);
}
function commit(){S.t=Date.now();persistLocal();pushCloud();render();}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    var got=await Promise.all([claude.use("user"),claude.use("db")]);
    var u=got[0],d=got[1];
    if(!u||!d)return;
    var id=await u.id();
    if(!id)return;
    cloud.ref=d.doc("data/users/"+id+"/tracker");
    var wait=setTimeout(function(){setSync("local");},10000);
    cloud.ref.onSnapshot(function(snap){
      clearTimeout(wait);
      var r=snap.exists?snap.data():null;
      var rt=r?(Number(r.t)||0):0;
      if(r&&rt>S.t){S=normalize(r);persistLocal();render();}
      else if(S.t>rt){pushCloud();}
      if(!cloud.busy)setSync("cloud");
    },function(){clearTimeout(wait);setSync("local");});
  }catch(e){setSync("local");}
}


/* ---------- export / import (CSV text you can copy and paste; no files or dialogs) ---------- */
function csvCell(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCsv(){
  var lines=["key,name,area,status"];
  W3.Q.forEach(function(q){
    var s=S.s[q.key];
    if(s===1||s===2)lines.push([q.key,q.name,W3.legName[q.leg],s===1?"done":"skipped"].map(csvCell).join(","));
  });
  lines.push(["dlc:hos","","","hos-"+(S.dlc.hos?"on":"off")].join(","));
  lines.push(["dlc:bw","","","bw-"+(S.dlc.bw?"on":"off")].join(","));
  return lines.join("\n");
}
function parseCsvLine(line){
  var out=[],cur="",q=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===","){out.push(cur);cur="";}
    else cur+=c;
  }
  out.push(cur);return out;
}
function importCsv(text){
  var n=W3.newState(),ok=0,bad=0;
  String(text).split(/\r?\n/).forEach(function(line,i){
    if(!line.trim()||i===0&&/^key,/i.test(line))return;
    var f=parseCsvLine(line),k=f[0].trim(),st=(f[3]||"").trim().toLowerCase();
    if(k==="dlc:hos"){n.dlc.hos=st.indexOf("off")<0;ok++;}
    else if(k==="dlc:bw"){n.dlc.bw=st.indexOf("off")<0;ok++;}
    else if(byKey[k]&&(st==="done"||st==="skipped")){n.s[k]=st==="done"?1:2;ok++;}
    else bad++;
  });
  if(!ok)return {ok:0,bad:bad};
  S.s=n.s;S.dlc=n.dlc;
  return {ok:ok,bad:bad};
}
function ioHtml(){
  if(!ui.io)return "";
  var ex=ui.io==="export";
  var text=ex?buildCsv():ui.ioText;
  return '<section class="iopanel" aria-labelledby="h-io"><h2 id="h-io">'+(ex?"Export progress":"Import progress")+'</h2>'+
    '<p>'+(ex?"Copy this text and keep it somewhere safe, or paste it back into chat. It lists every quest you have ticked or skipped.":"Paste an export here. Importing replaces the progress you have now.")+'</p>'+
    '<textarea id="iotext" spellcheck="false" aria-label="'+(ex?"Exported progress":"Progress to import")+'"'+(ex?' readonly':' placeholder="key,name,area,status"')+'>'+esc(text)+'</textarea>'+
    '<div class="acts">'+(ex?'<button class="go" data-act="iocopy">Copy to clipboard</button>':'<button class="go" data-act="iodo">Import</button>')+
    '<button data-act="ioclose">Close</button><span class="msg'+(ui.ioBad?" bad":"")+'" role="status">'+esc(ui.ioMsg||"")+'</span></div></section>';
}

/* ---------- rendering ---------- */
function st(k){return S.s[k]||0;}
function names(keys){return keys.map(function(k){return byKey[k]?byKey[k].name:k;});}
function jumpBtn(q,label){return '<button class="linkbtn" data-act="jump" data-k="'+q.key+'">'+esc(label||q.name)+'</button>';}
function tickBtn(q){
  var on=st(q.key)===1;
  return '<button class="tick" role="checkbox" aria-checked="'+on+'" aria-label="Mark '+esc(q.name)+' done" data-act="tick" data-k="'+q.key+'">'+CHECK+'</button>';
}

function smallTick(q,label){
  var on=st(q.key)===1;
  return '<button class="tick sm" role="checkbox" aria-checked="'+on+'" aria-label="'+esc(label)+'" data-act="tick" data-k="'+q.key+'">'+CHECK+'</button>';
}
function cbLine(q,text,cls,label,aria){
  return '<div class="'+cls+' cb">'+smallTick(q,aria)+'<div><b>'+label+'</b>'+esc(text)+'</div></div>';
}
function lines(t){return String(t||"").split("\n").filter(Boolean);}
/* Detail lines for a quest that has a stop-point part (shown in the ledger and in Do next). */
function splitDetail(q,cls){
  var pq=q.partQ,h="";
  lines(pq.note).forEach(function(n){h+='<div class="'+cls+'"><b>Guide</b>'+esc(n)+'</div>';});
  if(pq.stop)h+=cbLine(pq,pq.stop,"stop","Stop point","Stop point reached for "+q.name);
  lines(q.note).forEach(function(n,i){
    h+=i===0?cbLine(q,n,cls,"Guide","Finish "+q.name):'<div class="'+cls+'"><b>Guide</b>'+esc(n)+'</div>';
  });
  return h;
}
function kindTag(q){
  var t='<span class="tag '+q.kind+'">'+esc(W3.KINDS[q.kind]||"Side")+'</span>';
  if(q.part)t+='<span class="tag">Part</span>';
  if(q.opt)t+='<span class="tag">Optional</span>';
  if(q.region==="Multiple")t+='<span class="tag">Several regions</span>';
  if(q.level)t+='<span class="lv">Lv '+q.level+'</span>';
  return t;
}
function nameHtml(q){
  return q.url?'<a href="'+esc(q.url)+'" target="_blank" rel="noopener" title="Open the wiki page for this quest">'+esc(q.name)+'<span class="ext" aria-hidden="true">&#8599;</span></a>':esc(q.name);
}
function chainLink(p,label){
  if(!p||!p[0])return "";
  var nm=esc(p[0]);
  return label+" "+(p[1]?'<a href="'+esc(p[1])+'" target="_blank" rel="noopener">'+nm+'</a>':nm);
}
function cutNames(q,V){return q.cut.concat(q.pre).filter(function(c){return V.act.indexOf(byKey[c])>=0;}).map(function(c){return byKey[c].name;});}

function rowHtml(q,V){
  var s=st(q.key),lk=!!V.locked[q.key];
  var cls="row"+(s===1?" done":"")+(s===2?" skipped":"")+(lk?" lockedrow":"");
  var pills="";

    var gone=q.cut.filter(function(c){return st(c)===1;}).map(function(c){return byKey[c].name;});
    pills+='<span class="pill lock">Locked out: '+esc(gone.join(", "))+' is done</span>';
  }else if(!s&&V.risk[q.key]){
    pills+='<span class="pill risk">'+(q.soft?"Fewer options after: ":q.cut.length?"Lost after: ":"Do before: ")+esc(cutNames(q,V).join(", "))+'</span>';
  }
  if(!s){
    var w=q.hold.filter(function(h){return byKey[h]&&V.act.indexOf(byKey[h])>=0&&!st(h);});
    if(w.length)pills+='<span class="pill hold">Hold until: '+esc(names(w).join(", "))+'</span>';
  }
  var note=(q.partQ?splitDetail(q,"guide"):q.note.split("\n").filter(Boolean).map(function(n){return '<div class="guide"><b>Guide</b>'+esc(n)+'</div>';}).join(""))+
    (q.comment?'<div class="sheet"><b>Sheet</b>'+esc(q.comment)+'</div>':"");
  var chain=[chainLink(q.prev,"After:"),chainLink(q.next,"Next:")].filter(Boolean).join(" &nbsp;&middot;&nbsp; ");

  var stop=!q.partQ&&q.stop&&!s?'<div class="stop"><b>Stop point</b>'+esc(q.stop)+'</div>':"";
  return '<li class="'+cls+'" data-leg="'+q.leg+'" data-row="'+q.key+'">'+tickBtn(q)+
    '<div class="body"><div class="title"><span class="name">'+nameHtml(q)+'</span>'+kindTag(q)+'</div>'+
    (pills?'<div class="meta">'+pills+'</div>':"")+note+stop+'</div>'+
    '<button class="skip" data-act="skip" data-k="'+q.key+'" title="'+(s===2?"Put back on the list":"Not planning to do this one")+'">'+(s===2?"Undo skip":"Skip")+'</button></li>';
}

function nextHtml(V){
  var items=V.next.slice(0,6);

    var inside=V.act.filter(function(x){return x.during.indexOf(q.key)>=0&&!st(x.key)&&!V.locked[x.key];});
    var full=q.part?byKey[q.partOf]:q;
    var detail;
    if(q.part){
      detail=lines(q.note).map(function(n){return '<div class="pmeta">'+esc(n)+'</div>';}).join("")+cbLine(q,q.stop,"stop","Stop point","Stop point reached for "+full.name);
    }else if(q.partQ){detail=splitDetail(q,"pmeta");}
    else detail=q.stop?'<div class="stop"><b>Stop point</b>'+esc(q.stop)+'</div>':(q.note?'<div class="pmeta">'+esc(q.note)+'</div>':"");
    h+='<li'+(q.part?' style="padding-left:48px"':'')+'>'+(q.part?"":tickBtn(q))+'<div class="main"><button class="pname" data-act="jump" data-k="'+q.key+'">'+esc(full.name)+'</button><div class="pmeta">'+meta+'</div>'+detail+
      (inside.length?'<div class="pmeta"><b>Pick up inside this quest:</b> '+inside.map(function(x){return jumpBtn(x);}).join(", ")+'</div>':"")+'</div></li>';
  });
  h+='</ul>';
  h+=anytimeHtml(V);
  h+='</section>';
  return h;
}
function anytimeHtml(V){
  var items=V.anytime;
  if(!items.length)return "";
  var h='<div class="sublabel">Safe side quests, lowest level first</div><ul class="plist">';
  items.forEach(function(q){
    h+='<li>'+tickBtn(q)+'<div class="main"><button class="pname" data-act="jump" data-k="'+q.key+'">'+esc(q.name)+'</button><div class="pmeta"><b class="reg" data-leg="'+q.leg+'">'+esc(W3.legName[q.leg])+'</b>'+(q.level?" &middot; Lv "+q.level:"")+' &middot; '+esc(W3.KINDS[q.kind])+(V.gating[q.key]?' &middot; <b>do before '+esc(V.gating[q.key].name)+'</b>':"")+'</div></div></li>';
  });
  return h+'</ul>';
}

function avoidHtml(V){
  var now=V.gates.filter(function(g){return g.startable;});
  var later=V.gates.filter(function(g){return !g.startable;});
  var holdOnly=V.holds.filter(function(hh){return !V.gates.some(function(g){return g.q===hh.q;});});
  var h='<section class="panel avoid" aria-labelledby="h-avoid"><h2 id="h-avoid">Avoid for now</h2><div class="sub">Finishing these ends other quests you have not done yet.</div>';
  var limit=ui.moreAvoid?now.length:5;
  var shown=now.slice(0,limit);
  if(!shown.length&&!holdOnly.length)h+='<div class="empty">Nothing you can start right now cuts anything off.'+(later.length?" Cutoffs coming up are listed below.":"")+'</div>';
  h+='<ul class="plist">';
  function gateItem(g){
    var q=g.q,v=g.victims;
    var list=v.slice(0,4).map(function(x){return jumpBtn(x);}).join(", ")+(v.length>4?" and "+(v.length-4)+" more":"");
    var hold=V.holds.filter(function(hh){return hh.q===q;})[0];
    return '<li><div class="main"><button class="pname" data-act="jump" data-k="'+q.key+'">'+esc(q.name)+'</button>'+
      '<div class="pmeta">Locks out <b>'+v.length+'</b>: '+list+'</div>'+
      (g.blockers.length&&g.blockers.length!==v.length?'<div class="pmeta">Must do first: '+g.blockers.slice(0,3).map(function(x){return jumpBtn(x);}).join(", ")+(g.blockers.length>3?" +"+(g.blockers.length-3):"")+'</div>':"")+
      (hold?'<div class="pmeta">Also hold until: '+esc(hold.wait.map(function(x){return x.name;}).join(", "))+'</div>':"")+'</div></li>';
  }
  shown.forEach(function(g){h+=gateItem(g);});
  holdOnly.forEach(function(hh){
    h+='<li><div class="main"><button class="pname" data-act="jump" data-k="'+hh.q.key+'">'+esc(hh.q.name)+'</button><div class="pmeta">Guide says wait until: '+esc(hh.wait.map(function(x){return x.name;}).join(", "))+'</div></div></li>';
  });
  h+='</ul>';
  if(later.length){
    var top=ui.moreAvoid?later:later.slice(0,3);
    h+='<div class="empty"><b>Coming up:</b> '+top.map(function(g){return jumpBtn(g.q,g.q.name)+" ("+g.victims.length+")";}).join(", ")+(!ui.moreAvoid&&later.length>3?" and "+(later.length-3)+" more":"")+'</div>';
  }
  if(now.length>5||later.length>3)h+='<button class="more" data-act="moreavoid">'+(ui.moreAvoid?"Show fewer":"Show everything")+'</button>';
  h+='</section>';
  return h;
}

function tipsHtml(){
  return '<section class="panel" aria-labelledby="h-tips"><h2 id="h-tips">Rules of thumb</h2><ul class="tips">'+
   '<li>Simulate a Witcher 2 save when you start a new game. It unlocks the Voorhis talk that Ghosts of the Past needs.</li>'+
   '<li>Leave Blood and Wine until the main story is finished, or Dandelion moves into your estate instead of Ciri.</li>'+
   '<li>Do not pick up witcher gear diagrams before buying the scavenger hunt maps. It can break those quests.</li>'+
   '<li>Check each journal entry for failed objectives. Walking away from a quest or sparing the wrong person can fail it.</li>'+
   '<li>Skip means you are not planning a quest, so it stops counting as a warning.</li></ul></section>';
}

function routeHtml(V){
  var segs="",labs="";
  W3.LEGS.forEach(function(l){
    
    var L=V.leg[l[0]];
    var dlcOff=(l[0]==="hos"&&!S.dlc.hos)||(l[0]==="bw"&&!S.dlc.bw);
    if(dlcOff||!L.total)return;
    var p=((L.done+L.skip)/L.total*100).toFixed(1),lost=(L.lost/L.total*100).toFixed(1);
    segs+='<button class="seg" data-leg="'+l[0]+'" style="--w:'+L.total+';--p:'+p+'%;--l:'+lost+'%" data-act="gotoleg" data-leg="'+l[0]+'" aria-label="'+esc(l[1])+': '+L.done+' of '+L.total+' done" title="'+esc(l[1])+': '+L.done+'/'+L.total+(L.lost?", "+L.lost+" locked out":"")+'"><i></i><u></u></button>';
    labs+='<span data-leg="'+l[0]+'" style="--w:'+L.total+'">'+esc(l[2])+'</span>';
  });
  return '<div class="route" role="group" aria-label="Progress by region">'+segs+'</div><div class="route-labels" aria-hidden="true">'+labs+'</div>';
}

function filterOk(q,V){
  var s=st(q.key),lk=!!V.locked[q.key];
  if(ui.filter==="todo"&&(s||lk))return false;
  if(ui.filter==="risk"&&!V.risk[q.key])return false;
  if(ui.filter==="done"&&s!==1)return false;
  if(ui.filter==="locked"&&!lk)return false;
  if(ui.type!=="all"){
    if(ui.type==="event"){if(q.kind!=="event"&&q.kind!=="race")return false;}
    else if(q.kind!==ui.type)return false;
  }
  if(ui.search){
    var hay=(q.name+" "+q.note+" "+q.comment+" "+q.stop+" "+W3.KINDS[q.kind]).toLowerCase();
    if(hay.indexOf(ui.search.toLowerCase())<0)return false;
  }
  return true;
}

function ledgerHtml(V){
  var any=false,h="";
  var force=ui.filter!=="all"||ui.type!=="all"||!!ui.search;
  W3.LEGS.forEach(function(l){
    var rows=V.act.filter(function(q){return q.leg===l[0]&&!q.part&&filterOk(q,V);})
      .sort(function(a,b){return a.name.localeCompare(b.name,undefined,{sensitivity:"base",numeric:true});});
    if(!rows.length)return;
    any=true;
    var L=V.leg[l[0]];
    var open=force||ui.open[l[0]];
    h+='<section class="group" data-leg="'+l[0]+'"><button class="ghead" data-act="toggleleg" data-leg="'+l[0]+'" aria-expanded="'+!!open+'"><h3>'+esc(l[1])+'</h3>'+
      '<span class="gcount">'+L.done+'/'+L.total+'</span>'+(L.lost?'<span class="gcount lost">'+L.lost+' lost</span>':"")+'<span class="chev"></span></button>';
    if(open)h+='<ul class="rows">'+rows.map(function(q){return rowHtml(q,V);}).join("")+'</ul>';
    h+='</section>';
  });
  return any?h:'<div class="nores">Nothing matches that filter.</div>';
}

function render(){
  var V=W3.view(S);
  if(!ui.opened){
    ui.opened=true;
    var first=V.next[0]||V.anytime[0];
    ui.open[first?first.leg:"wo"]=true;
  }
  var active=document.activeElement,keepSearch=active&&active.id==="q",pos=keepSearch?active.selectionStart:0;
  var flt=[["all","All"],["todo","To do"],["risk","At risk"],["done","Done"],["locked","Locked out"]];
  var typ=[["all","Any type"],["main","Main"],["side","Side"],["contract","Contracts"],["treasure","Treasure"],["event","Events"]];
  var html='<header class="top"><div><div class="eyebrow">The Witcher 3: Wild Hunt</div><h1>Witcher Quest Ledger</h1></div>'+
    '<div class="stats"><div class="stat"><b>'+V.done+'</b><span>of '+V.total+' done</span></div>'+
    '<div class="stat warn"><b>'+V.atrisk+'</b><span>with a cutoff ahead</span></div>'+
    '<div class="stat bad"><b>'+V.lost+'</b><span>locked out</span></div></div></header>'+
    routeHtml(V)+'<div class="route-cap">Bar width is the number of quests in each region. The coloured fill is done, red is locked out. Tap a segment to jump to it.</div>'+
    '<div class="layout"><aside>'+nextHtml(V)+avoidHtml(V)+tipsHtml()+'</aside><main>'+
    '<div class="controls"><div class="seggroup" role="group" aria-label="Filter quests">'+
    flt.map(function(f){return '<button data-act="filter" data-f="'+f[0]+'" aria-pressed="'+(ui.filter===f[0])+'">'+f[1]+'</button>';}).join("")+'</div>'+
    '<div class="seggroup" role="group" aria-label="Filter by type">'+
    typ.map(function(f){return '<button data-act="type" data-f="'+f[0]+'" aria-pressed="'+(ui.type===f[0])+'">'+f[1]+'</button>';}).join("")+'</div>'+
    '<input id="q" class="search" type="search" placeholder="Search quests" aria-label="Search quests" value="'+esc(ui.search)+'"></div>'+
    '<div class="controls"><div class="dlc">'+
    '<label><input type="checkbox" id="dlc-hos" data-act="dlc" data-d="hos"'+(S.dlc.hos?" checked":"")+'> Hearts of Stone</label>'+
    '<label><input type="checkbox" id="dlc-bw" data-act="dlc" data-d="bw"'+(S.dlc.bw?" checked":"")+'> Blood and Wine</label></div></div>'+
    ledgerHtml(V)+'</main></div>'+
    ioHtml()+'<footer><div>Built from the Steam guide <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=1637796489" target="_blank" rel="noopener">Miss Me With That Missable Content</a> and Game Rant\'s <a href="https://gamerant.com/witcher-3-all-missable-quests-cutoff-points/" target="_blank" rel="noopener">missable quest cutoffs</a>. The CD Projekt RED forum thread could not be loaded, so it is not included. Quest list, levels and quest-page links come from the <em>Witcher 3 Quest List</em> spreadsheet, whose names link to <a href="https://witcher.fandom.com/wiki/The_Witcher_3_secondary_quests" target="_blank" rel="noopener">the Witcher wiki</a>. Where sources disagree, the stricter cutoff is used. Gwent player and card-shop tabs are not included.</div>'+
    '<div><span class="sync" id="sync">'+syncText()+'</span> &nbsp; <button class="reset" data-act="io" data-m="export">Export</button> <button class="reset" data-act="io" data-m="import">Import</button> <button class="reset'+(ui.armed?" arm":"")+'" data-act="reset">'+(ui.armed?"Click again to clear everything":"Reset progress")+'</button></div></footer>';
  app.innerHTML=html;
  if(keepSearch){var el=document.getElementById("q");if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(e){}}}
}

/* ---------- events ---------- */
/* Ticking a quest also ticks the steps that must come before it. */
function markDone(k){
  S.s[k]=1;
  byKey[k].needs.forEach(function(n){if(!st(n))markDone(n);});
}
function jump(k){
  var q=byKey[k];if(!q)return;
  if(q.partOf&&byKey[q.partOf]){k=q.partOf;q=byKey[k];}
  if(q.dlc&&!S.dlc[q.dlc]){S.dlc[q.dlc]=true;}
  ui.filter="all";ui.type="all";ui.search="";ui.open[q.leg]=true;render();
  var el=app.querySelector('[data-row="'+k+'"]');
  if(el){el.scrollIntoView({block:"center",behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});el.classList.add("flash");}
}
app.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.getAttribute("data-act"),k=t.getAttribute("data-k");
  if(a==="tick"){if(st(k)===1)delete S.s[k];else markDone(k);commit();}
  else if(a==="skip"){if(st(k)===2)delete S.s[k];else S.s[k]=2;commit();}
  else if(a==="jump"){jump(k);}
  else if(a==="filter"){ui.filter=t.getAttribute("data-f");render();}
  else if(a==="type"){ui.type=t.getAttribute("data-f");render();}
  else if(a==="toggleleg"){var l=t.getAttribute("data-leg");ui.open[l]=!ui.open[l];render();}
  else if(a==="gotoleg"){var g=t.getAttribute("data-leg");ui.filter="all";ui.type="all";ui.search="";ui.open[g]=true;render();var hd=app.querySelector('[data-act="toggleleg"][data-leg="'+g+'"]');if(hd)hd.scrollIntoView({block:"start",behavior:"smooth"});}
  else if(a==="moreavoid"){ui.moreAvoid=!ui.moreAvoid;render();}
  else if(a==="io"){var m=t.getAttribute("data-m");ui.io=(ui.io===m)?"":m;ui.ioMsg="";ui.ioBad=false;if(m==="import")ui.ioText="";render();var p=app.querySelector(".iopanel");if(p)p.scrollIntoView({block:"center"});}
  else if(a==="ioclose"){ui.io="";render();}
  else if(a==="iocopy"){
    var ta=document.getElementById("iotext");ta.focus();ta.select();
    var done=function(ok){ui.ioMsg=ok?"Copied.":"Select the text and copy it.";ui.ioBad=!ok;var el=app.querySelector(".iopanel .msg");if(el){el.textContent=ui.ioMsg;el.className="msg"+(ok?"":" bad");}};
    try{navigator.clipboard.writeText(ta.value).then(function(){done(true);},function(){done(false);});}catch(e){done(false);}
  }
  else if(a==="iodo"){
    var r=importCsv(ui.ioText);
    if(!r.ok){ui.ioMsg="Nothing in that text matched a quest.";ui.ioBad=true;render();}
    else{ui.ioMsg="Imported "+r.ok+" rows"+(r.bad?" ("+r.bad+" not recognised)":"")+".";ui.ioBad=false;commit();}
  }
  else if(a==="reset"){
    if(!ui.armed){ui.armed=true;render();setTimeout(function(){if(ui.armed){ui.armed=false;render();}},4000);}
    else{ui.armed=false;S.s={};commit();}
  }
});
app.addEventListener("change",function(e){
  var t=e.target;
  if(t.getAttribute&&t.getAttribute("data-act")==="dlc"){S.dlc[t.getAttribute("data-d")]=t.checked;commit();}
});
app.addEventListener("input",function(e){
  if(e.target.id==="q"){ui.search=e.target.value;render();}
  else if(e.target.id==="iotext"){ui.ioText=e.target.value;}
});

loadLocal();
render();
initCloud();
})();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
